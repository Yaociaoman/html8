<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Circle Calculator</title>
</head>
<body>

<h2>Circle Properties Calculator</h2>

<p id="circumference"></p>
<p id="area"></p>

<script>
    function calcCircumference(radius) {
        let circumference = 2 * Math.PI * radius;
        return "The circumference is " + circumference.toFixed(2);
    }

    function calcArea(radius) {
        let area = Math.PI * radius * radius;
        return "The area is " + area.toFixed(2);
    }
    
    let radius = 5;

    document.getElementById("circumference").innerHTML =calcCircumference(radius);

    document.getElementById("area").innerHTML =calcArea(radius);
       
</script>

</body>
</html>
